# Portería del mercado. nginx es el único punto de entrada para Grafana y Prometheus.
# Cada ruta lleva a un servicio interno. nginx le saca el prefijo antes de pasarle la petición,
# por eso Grafana y Prometheus necesitan saber con qué dirección los ven desde afuera.

# DNS interno de Docker. Con resolve, nginx vuelve a preguntar cada 10 segundos. Así encuentra a
# una réplica que se recreó con otra IP y deja de mandar peticiones a una que se detuvo. Mientras
# no se entera, la conexión a la réplica detenida falla en 2 segundos y nginx prueba con la otra.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream grafanas {
  zone grafanas 64k;
  server grafana:3000 resolve max_fails=1 fail_timeout=10s;
  server grafana-2:3000 resolve max_fails=1 fail_timeout=10s;
}

# Los Prometheus también van por upstream con resolve, así nginx arranca aunque alguno todavía
# no exista.
upstream prometheus {
  zone prometheus 64k;
  server prometheus:9090 resolve;
}

upstream borde {
  zone borde 64k;
  server prometheus-borde:9090 resolve;
}

# Grafana Live usa WebSocket. Estas dos líneas pasan la cabecera Upgrade cuando viene.
map $http_upgrade $conexion {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name localhost;

  # Para el healthcheck del contenedor.
  location = /salud {
    access_log off;
    return 200 "ok\n";
  }

  location = / {
    return 302 /grafana/;
  }

  # Grafana. Dos réplicas sobre la misma base. Si una no responde, nginx prueba con la otra.
  location /grafana/ {
    proxy_pass http://grafanas/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    # Para ver en la respuesta qué réplica atendió.
    add_header X-Replica $upstream_addr always;
  }

  # Prometheus principal.
  location /prometheus/ {
    proxy_pass http://prometheus/;
    proxy_set_header Host $host;
  }

  # Prometheus de borde, el que federa.
  location /borde/ {
    proxy_pass http://borde/;
    proxy_set_header Host $host;
  }

  # Lista de destinos para el descubrimiento HTTP de Prometheus. Es un archivo JSON estático.
  location /sd/ {
    alias /usr/share/nginx/sd/;
    default_type application/json;
  }
}
