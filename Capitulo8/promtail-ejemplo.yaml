# Configuración de Promtail de ejemplo para la Práctica 8. Hace lo mismo que el Alloy del stack
# después del paso 3. Promtail ya no recibe funciones nuevas y su reemplazo es Alloy.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contenedores
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=gpe"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
    pipeline_stages:
      - drop:
          expression: '.*"route": ?"/(salud|metrics)".*'
          drop_counter_reason: healthcheck
      - json:
          expressions:
            level: level
            trace_id: trace_id
      - labels:
          level:
      - structured_metadata:
          trace_id:
