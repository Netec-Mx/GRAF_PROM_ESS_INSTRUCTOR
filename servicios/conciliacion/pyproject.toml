[project]
name = "conciliacion"
version = "0.1.0"
description = "Job por lotes de Tianguis Digital: cruza pedidos confirmados con pagos."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "ANN", "ARG"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
