spring.application.name=pagos
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

server.port=${PUERTO:8080}
server.shutdown=graceful

# Sin recursos estáticos: una ruta que no existe responde 404 por el manejador de errores.
spring.web.resources.add-mappings=false

# Logs en JSON por stdout, con el formato propio del servicio.
logging.structured.format.console=mx.tianguis.pagos.api.FormatoDeLogs

# Token de /caos. Vacío, /caos no existe.
pagos.caos.token=${CAOS_TOKEN:}

pagos.pedidos.url=${PEDIDOS_URL:http://pedidos:8080}
pagos.pedidos.timeout=${PEDIDOS_TIMEOUT:2s}

# Cuántos pagos se conservan para consultarlos, y cuántos pedidos pagados se recuerdan para no
# cobrarlos dos veces. El segundo no se vacía al descartar pagos.
pagos.repositorio.capacidad=1000
pagos.repositorio.capacidad-de-pagados=100000
