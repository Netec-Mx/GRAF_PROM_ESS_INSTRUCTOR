# OpenTelemetry Collector (contrib) del stack gpe.
# Recibe OTLP por gRPC y HTTP. Trazas a Tempo, métricas a Prometheus por OTLP.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 60
  batch:
    timeout: 5s
  # Descarta las trazas del healthcheck (GET /salud cada 10 s por servicio), para que no
  # tapen las trazas del tráfico real en Tempo.
  filter/salud:
    error_mode: ignore
    traces:
      span:
        - attributes["url.path"] == "/salud"

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/salud, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
